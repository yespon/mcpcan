#     {
#       "auths": {
#         "YOUR_HARBOR_REGISTRY": {
#           "username": "YOUR_USERNAME",
#           "password": "YOUR_PASSWORD",
#           "auth": "YOUR_BASE64_ENCODED_AUTH"
#         }
#       }
#     }

---
# ============================================================================
# Secret：K8s API 访问令牌（mcp-market 运行环境需要）
# ============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: mcpcan-kubeconfig
  namespace: mcpcan
  labels:
    app.kubernetes.io/name: mcpcan
    app.kubernetes.io/component: kubeconfig
type: Opaque
stringData:
  kubeconfig.yaml: |
    apiVersion: v1
    kind: Config
    clusters:
      - name: cluster
        cluster:
          certificate-authority: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
          server: https://kubernetes.default.svc
    users:
      - name: sa-user
        user:
          tokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
    contexts:
      - name: market-context
        context:
          cluster: cluster
          user: sa-user
          namespace: mcpcan
    current-context: market-context
