# MCPCan K8s 私有化部署 - ConfigMap 和 Secret 配置
#
# 功能：
# 1. ConfigMap：存储所有服务配置文件（authz.yaml、market.yaml、Traefik 配置等）
# 2. Secret：存储敏感信息（数据库密码、应用密钥、镜像仓库认证等）

---
# ============================================================================
# ConfigMap：应用配置存储
# ============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: mcpcan-config
  namespace: mcpcan
  labels:
    app.kubernetes.io/name: mcpcan
    app.kubernetes.io/component: config
data:
  # ────────────────────────────────────────────────────────────────
  # Market 服务配置（mcp-market）
  # ────────────────────────────────────────────────────────────────
  market.yaml: |
    runMode: prod
    server:
      serviceName: mcp-market-svc
      httpPort: 8080
    secret: "MrKuvLNn0hc1kHRbA6EqjSPj1ecrbPDE"
    # K8s 运行环境配置
    runEnvironment:
      enabled: true
      name: "Default-Run-Environment"
      type: "kubernetes"
      kubernetes:
        namespace: mcpcan
        configPath: "/etc/kube/kubeconfig.yaml"
    # 内部服务访问配置
    services:
      mcpMarket:
        host: mcp-market-svc
        port: 8080
      mcpAuthz:
        host: mcp-authz-svc
        port: 8081
    # 数据库配置（从 Secret 注入）
    database:
      mysql:
        host: mysql-svc      # 改为外部 MySQL 地址，或本地 mysql-svc
        port: 3306
        database: mcp_dev
        username: mcp_user
        password: "dev-password"
      redis:
        host: redis-svc      # 改为外部 Redis 地址，或本地 redis-svc
        port: 6379
        password: "dev-redis-password"
    log:
      level: debug
      format: json
    code:
      upload:
        maxFileSize: 100
        allowedExtensions: [".zip", ".tar.gz", ".tar", ".dxt", ".mcpb"]
    storage:
      rootPath: /data/mcpcan
      codePath: /data/mcpcan/code-package
      staticPath: /data/mcpcan/static
      openapiFilePath: /data/mcpcan/openapi-file
    init:
      admin_username: admin
      admin_password: admin123
      admin_nickname: admin
      admin_role_name: admin
      admin_role_description: admin role
      admin_role_level: 1
      admin_data_scope: all

  # ────────────────────────────────────────────────────────────────
  # Authz 服务配置（mcp-authz）
  # ────────────────────────────────────────────────────────────────
  authz.yaml: |
    runMode: prod
    server:
      serviceName: mcp-authz-svc
      httpPort: 8081
    secret: "MrKuvLNn0hc1kHRbA6EqjSPj1ecrbPDE"
    database:
      mysql:
        host: mysql-svc
        port: 3306
        database: mcp_dev
        username: mcp_user
        password: "dev-password"
      redis:
        host: redis-svc
        port: 6379
        password: "dev-redis-password"
        db: 0
    log:
      level: debug
      format: json
    storage:
      rootPath: /data/mcpcan
      codePath: /data/mcpcan/code-package
      staticPath: /data/mcpcan/static

  # ────────────────────────────────────────────────────────────────
  # Traefik 动态路由配置（mcp-entry）
  # ────────────────────────────────────────────────────────────────
  dynamic.yaml: |
    http:
      middlewares:
        # 中间件：去掉 /api 前缀
        strip-api-prefix:
          stripPrefix:
            prefixes:
              - "/api"
        # 中间件：去掉 / 前缀
        strip-web-prefix:
          stripPrefix:
            prefixes:
              - "/"
        # 中间件：外部认证（ForwardAuth）
        external-auth:
          forwardAuth:
            address: "http://mcp-authz-svc:8081/authz/validate"
            maxResponseBodySize: 1048576
            trustForwardHeader: true
            authRequestHeaders:
              - "Authorization"
              - "X-API-Key"
              - "Cookie"
              - "User-Agent"
            authResponseHeaders:
              - "X-Consum-User-Id"
              - "X-Custom-User-Info"
              - "X-Trace-Id"

      routers:
        # 路由：认证公开端点（无需验证）
        authz-public:
          rule: "PathPrefix(`/api/authz/login`) || PathPrefix(`/api/authz/logout`) || PathPrefix(`/api/authz/register`) || PathPrefix(`/api/authz/refresh`) || PathPrefix(`/api/authz/validate`) || PathPrefix(`/api/authz/encryption-key`) || PathPrefix(`/health`)"
          service: "authz-service"
          entryPoints: ["web"]
          middlewares:
            - "strip-api-prefix"
          priority: 100

        # 路由：市场下载端点（无需验证）
        market-public:
          rule: "PathPrefix(`/api/market/code/download`) || PathPrefix(`/api/market/openapi/download`)"
          service: "market-service"
          entryPoints: ["web"]
          middlewares:
            - "strip-api-prefix"
          priority: 100

        # 路由：认证保护端点（需要验证）
        authz-protected:
          rule: "PathPrefix(`/api/authz`)"
          service: "authz-service"
          entryPoints: ["web"]
          middlewares:
            - "strip-api-prefix"
            - "external-auth"

        # 路由：市场端点（需要验证）
        market-router:
          rule: "PathPrefix(`/api/market`)"
          service: "market-service"
          entryPoints: ["web"]
          middlewares:
            - "strip-api-prefix"
            - "external-auth"

        # 路由：MCP 网关（无需验证）
        mcp-gateway:
          rule: "PathPrefix(`/mcp-gateway`)"
          service: "market-service"
          entryPoints: ["web"]
          middlewares: []
          priority: 1000

        # 路由：Web 前端（根路径）
        web-router:
          rule: "PathPrefix(`/`)"
          service: "web-service"
          entryPoints: ["web"]
          middlewares: []
          priority: 1

      services:
        # 认证服务
        authz-service:
          loadBalancer:
            servers:
              - url: "http://mcp-authz-svc:8081"

        # 市场服务
        market-service:
          loadBalancer:
            servers:
              - url: "http://mcp-market-svc:8080"

        # Web 服务
        web-service:
          loadBalancer:
            servers:
              - url: "http://mcp-web-svc:3000"

  # ────────────────────────────────────────────────────────────────
  # Traefik 静态配置（mcp-entry）
  # ────────────────────────────────────────────────────────────────
  traefik.yaml: |
    global:
      checkNewVersion: false
      sendAnonymousUsage: false
    api:
      dashboard: true
      insecure: true
    entryPoints:
      web:
        address: ":80"
    providers:
      file:
        filename: "/etc/traefik/dynamic.yaml"
        watch: true
    log:
      level: "INFO"
      format: "json"
    accessLog:
      format: "json"
      fields:
        headers:
          defaultMode: keep
          names:
            X-Consum-User: keep

  # ────────────────────────────────────────────────────────────────
  # Web 前端配置（mcp-web）
  # ────────────────────────────────────────────────────────────────
  env.js: |
    window.__APP_CONFIG__ = {"VITE_DEMO":"false", "PUBLIC_PATH":"/", "API_BASE":"/api"}

  # ────────────────────────────────────────────────────────────────
  # 数据库初始化脚本（可选：如在 K8s 内运行 MySQL）
  # ────────────────────────────────────────────────────────────────
  mysql-init.sql: |
    CREATE DATABASE IF NOT EXISTS mcp_dev DEFAULT CHARACTER SET utf8mb4 COLLATE utf8mb4_general_ci;
    CREATE USER IF NOT EXISTS 'mcp_user'@'%' IDENTIFIED BY 'dev-password';
    GRANT ALL PRIVILEGES ON mcp_dev.* TO 'mcp_user'@'%';
    FLUSH PRIVILEGES;

  # ────────────────────────────────────────────────────────────────
  # MySQL 配置文件
  # ────────────────────────────────────────────────────────────────
  my.cnf: |
    [mysqld]
    bind-address = 0.0.0.0
    port = 3306
    default-authentication-plugin = caching_sha2_password
    character-set-server = utf8mb4
    collation-server = utf8mb4_unicode_ci
    max_connections = 1000
    innodb_buffer_pool_size = 256M
    innodb_log_file_size = 64M
    slow_query_log = 1
    slow_query_log_file = /var/log/mysql/slow.log
    long_query_time = 2

---
# ============================================================================
# Secret：敏感信息存储
# ============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: mcpcan-secrets
  namespace: mcpcan
  labels:
    app.kubernetes.io/name: mcpcan
    app.kubernetes.io/component: secrets
type: Opaque
stringData:
  # MySQL 认证信息
  MYSQL_ROOT_PASSWORD: "dev-root-password"
  MYSQL_USER: "mcp_user"
  MYSQL_PASSWORD: "dev-password"
  MYSQL_DATABASE: "mcp_dev"
  
  # Redis 认证信息
  REDIS_PASSWORD: "dev-redis-password"
  
  # 应用密钥
  APP_SECRET: "MrKuvLNn0hc1kHRbA6EqjSPj1ecrbPDE"

---
# ============================================================================
# Secret：镜像仓库认证（Docker Registry）
# ============================================================================
# 注意：如果镜像仓库为公开，不需要此 Secret
# 如果需要私有 Harbor 认证，取消注释并填入正确的值
# apiVersion: v1
# kind: Secret
# metadata:
#   name: mcpcan-registry-secret
#   namespace: mcpcan
#   type: kubernetes.io/dockerconfigjson
# data:
