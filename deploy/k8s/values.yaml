# MCPCan K8s 私有化部署 - 当前参数参考
#
# 说明：
# 1. 本文件已对齐当前部署方案：外部 MySQL、外部 Redis、火山云 TOS S3 存储。
# 2. 当前 deploy/k8s/*.yaml 仍是静态清单，修改本文件不会自动渲染到 YAML。
# 3. 建议把本文件作为部署前核对清单，并将改动同步到：
#    - 1-configmap-secret.yaml
#    - 2-services-deployment.yaml
#    - 3-ingress.yaml
#    - 4-storage-s3.yaml

# ============================================================================
# [必填] 基础部署约束
# ============================================================================
# 当前静态清单固定命名空间为 mcpcan
KUBE_NAMESPACE=mcpcan

# 当前 Ingress 清单固定为 nginx
INGRESS_CLASS=nginx

# 部署等待超时（秒）
WAIT_TIMEOUT=300

# market 服务访问 K8s API 所需 Secret 名称
KUBECONFIG_SECRET_NAME=mcpcan-kubeconfig

# Harbor 拉取凭证 Secret 名称（如 Harbor 需要认证）
HARBOR_PULL_SECRET=harbor-registry-secret

# ============================================================================
# [必填] 镜像仓库配置
# ============================================================================
HARBOR_REGISTRY=harbor.example.com
HARBOR_PROJECT=mcpcan
HARBOR_USER=admin
HARBOR_PASS=Harbor12345

# 镜像版本（对应项目 VERSION）
IMAGE_VERSION=v2.1.1

# 应用镜像
AUTHZ_IMAGE=harbor.example.com/mcpcan/mcp-authz:v2.1.1
MARKET_IMAGE=harbor.example.com/mcpcan/mcp-market:v2.1.1
WEB_IMAGE=harbor.example.com/mcpcan/mcp-web:v2.1.1

# 基础镜像（私有化集群建议同步至 Harbor）
TRAEFIK_IMAGE=harbor.example.com/infra/traefik:v3.6.9
CSI_S3_IMAGE=harbor.example.com/infra/csi-s3:v0.35.5
CSI_PROVISIONER_IMAGE=harbor.example.com/infra/csi-provisioner:v4.0.0
CSI_ATTACHER_IMAGE=harbor.example.com/infra/csi-attacher:v4.4.0
CSI_NODE_DRIVER_REGISTRAR_IMAGE=harbor.example.com/infra/csi-node-driver-registrar:v2.9.0

# 镜像拉取策略
IMAGE_PULL_POLICY=IfNotPresent

# ============================================================================
# [必填] 外部 MySQL 配置
# ============================================================================
EXTERNAL_MYSQL_HOST=mysql.company.com
EXTERNAL_MYSQL_PORT=3306
EXTERNAL_MYSQL_DATABASE=mcp_dev
EXTERNAL_MYSQL_USER=mcp_user
EXTERNAL_MYSQL_PASSWORD=your_secure_password

# ============================================================================
# [必填] 外部 Redis 配置
# ============================================================================
EXTERNAL_REDIS_HOST=redis.company.com
EXTERNAL_REDIS_PORT=6379
EXTERNAL_REDIS_PASSWORD=your_redis_password
EXTERNAL_REDIS_DB=0

# ============================================================================
# [必填] 火山云 TOS S3 存储配置
# ============================================================================
TOS_BUCKET=mcpcan-data
TOS_REGION=cn-beijing
TOS_ENDPOINT=https://tos-s3-cn-beijing.volces.com
TOS_ACCESS_KEY_ID=replace_me
TOS_SECRET_ACCESS_KEY=replace_me

# StorageClass / PVC
TOS_STORAGE_CLASS=volcengine-tos
TOS_PVC_NAME=mcpcan-data-pvc
TOS_STORAGE_SIZE=75Gi
TOS_MOUNTER=geesefs

# 业务目录映射
APP_ROOT_PATH=/data/mcpcan
APP_CODE_PATH=/data/mcpcan/code-package
APP_STATIC_PATH=/data/mcpcan/static
APP_OPENAPI_PATH=/data/mcpcan/openapi-file

# ============================================================================
# [关键] 应用初始化配置
# ============================================================================
RUN_MODE=prod
CODE_MODE=OpenCode

# 应用密钥（JWT / 加密）
APP_SECRET=replace_with_random_secret

# 初始化管理员
ADMIN_USERNAME=admin
ADMIN_PASSWORD=replace_with_strong_password
ADMIN_NICKNAME=管理员
ADMIN_ROLE_NAME=admin
ADMIN_ROLE_DESCRIPTION=系统管理员角色
ADMIN_ROLE_LEVEL=1
ADMIN_DATA_SCOPE=all

# market 容器中的镜像前缀变量
REGISTORY_IMAGE_MIRROR=harbor.example.com/mcpcan

# ============================================================================
# [可选] 服务规模与资源配置
# ============================================================================
AUTHZ_REPLICAS=1
AUTHZ_CPU_REQUEST=500m
AUTHZ_MEMORY_REQUEST=256Mi
AUTHZ_CPU_LIMIT=1000m
AUTHZ_MEMORY_LIMIT=512Mi

MARKET_REPLICAS=1
MARKET_CPU_REQUEST=1000m
MARKET_MEMORY_REQUEST=512Mi
MARKET_CPU_LIMIT=2000m
MARKET_MEMORY_LIMIT=1Gi

WEB_REPLICAS=1
WEB_CPU_REQUEST=256m
WEB_MEMORY_REQUEST=128Mi
WEB_CPU_LIMIT=512m
WEB_MEMORY_LIMIT=256Mi

ENTRY_REPLICAS=1
ENTRY_CPU_REQUEST=128m
ENTRY_MEMORY_REQUEST=64Mi
ENTRY_CPU_LIMIT=512m
ENTRY_MEMORY_LIMIT=256Mi

# ============================================================================
# [可选] 网络与入口配置
# ============================================================================
# 当前 2-services-deployment.yaml 默认使用 LoadBalancer
ENTRY_SERVICE_TYPE=LoadBalancer

# 如切换为 NodePort，可预留如下端口
NODE_PORT_HTTP=30080
NODE_PORT_HTTPS=30443
NODE_PORT_DASHBOARD=30090

# Ingress / 域名
WEB_PATH_RULE=/
API_PATH_RULE=/api
INGRESS_HOST=

# TLS
TLS_ENABLED=false
TLS_SECRET_NAME=mcpcan-tls
TLS_CRT_PATH=/path/to/cert.crt
TLS_KEY_PATH=/path/to/cert.key

# ============================================================================
# [可选] 文件上传 / 日志
# ============================================================================
MAX_FILE_SIZE=100
ALLOWED_EXTENSIONS=.zip,.tar.gz,.tar,.dxt,.mcpb
LOG_LEVEL=debug
LOG_FORMAT=json

# ============================================================================
# [部署前核对]
# ============================================================================
# 1. 1-configmap-secret.yaml 中 mysql.host / redis.host 已替换为外部地址
# 2. 4-storage-s3.yaml 中 TOS AccessKey / Secret / endpoint / bucket 已替换
# 3. 2-services-deployment.yaml 中镜像地址已替换为真实 Harbor 地址
# 4. 如 Harbor 需要认证，已创建 harbor-registry-secret，并在 Deployment 中引用 imagePullSecrets
# 5. 已创建 mcpcan-kubeconfig Secret
