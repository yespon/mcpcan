# MCPCan K8s 私有化部署 - 各服务 Deployment 和 Service 配置
#
# 说明：
# - 使用外部 MySQL 和 Redis 服务（推荐生产环境）
# - 修改 HARBOR_REGISTRY 为实际的 Harbor 地址
# - 修改 ConfigMap 中的数据库连接信息（mysql.host, redis.host）
# - 应用数据通过火山云 TOS PVC 持久化存储（ReadWriteMany），配置见 4-storage-s3.yaml

---
# ============================================================================
# Authz Service Deployment
# ============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-authz
  namespace: mcpcan
  labels:
    app: mcp-authz
    app.kubernetes.io/name: mcp-authz
    app.kubernetes.io/component: authz
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mcp-authz
  template:
    metadata:
      labels:
        app: mcp-authz
        app.kubernetes.io/name: mcp-authz
    spec:
      containers:
      - name: mcp-authz
        image: 77kymo/mcp-authz:v2.1.1  # 改为实际 Harbor 地址
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8081
          name: http
        env:
        - name: CODE_MODE
          value: "OpenCode"
        resources:
          requests:
            memory: "256Mi"
            cpu: "500m"
          limits:
            memory: "512Mi"
            cpu: "1000m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8081
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 8081
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 2
          failureThreshold: 3
        volumeMounts:
        - name: config-volume
          mountPath: /app/config
          readOnly: true
        - name: data-volume
          mountPath: /data/mcpcan
      # 注意：使用外部 MySQL/Redis，无需等待 initContainers
      # 确保外部数据库服务可访问（网络连通性），修改 ConfigMap 中的连接地址
      volumes:
      - name: config-volume
        configMap:
          name: mcpcan-config
          items:
          - key: authz.yaml
            path: authz.yaml
      - name: data-volume
        persistentVolumeClaim:
          claimName: mcpcan-data-pvc

---
# Authz Service（ClusterIP）
apiVersion: v1
kind: Service
metadata:
  name: mcp-authz-svc
  namespace: mcpcan
  labels:
    app: mcp-authz
spec:
  type: ClusterIP
  ports:
  - port: 8081
    targetPort: 8081
    protocol: TCP
    name: http
  selector:
    app: mcp-authz

---
# ============================================================================
# Market Service Deployment
# ============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-market
  namespace: mcpcan
  labels:
    app: mcp-market
    app.kubernetes.io/name: mcp-market
    app.kubernetes.io/component: market
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mcp-market
  template:
    metadata:
      labels:
        app: mcp-market
        app.kubernetes.io/name: mcp-market
    spec:
      serviceAccountName: mcpcan-user  # 使用 ServiceAccount 访问 K8s API
      containers:
      - name: mcp-market
        image: 77kymo/mcp-market:v2.1.1  # 改为实际 Harbor 地址
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
          name: http
        env:
        - name: CODE_MODE
          value: "OpenCode"
        - name: REGISTORY_IMAGE_MIRROR
          value: "77kymo"  # 改为实际 Harbor 地址
        resources:
          requests:
            memory: "512Mi"
            cpu: "1000m"
          limits:
            memory: "1Gi"
            cpu: "2000m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 2
          failureThreshold: 3
        volumeMounts:
        - name: config-volume
          mountPath: /app/config
          readOnly: true
        - name: data-volume
          mountPath: /data/mcpcan
        - name: kubeconfig
          mountPath: /etc/kube
          readOnly: true
      # 注意：使用外部 MySQL/Redis，无需等待 initContainers
      # 确保外部数据库服务可访问（网络连通性），修改 ConfigMap 中的连接地址
      volumes:
      - name: config-volume
        configMap:
          name: mcpcan-config
          items:
          - key: market.yaml
            path: market.yaml
      - name: data-volume
        persistentVolumeClaim:
          claimName: mcpcan-data-pvc
      - name: kubeconfig
        secret:
          secretName: mcpcan-kubeconfig
          items:
          - key: kubeconfig.yaml
            path: kubeconfig.yaml

---
# Market Service（ClusterIP）
apiVersion: v1
kind: Service
metadata:
  name: mcp-market-svc
  namespace: mcpcan
  labels:
    app: mcp-market
spec:
  type: ClusterIP
  ports:
  - port: 8080
    targetPort: 8080
    protocol: TCP
    name: http
  selector:
    app: mcp-market

---
# ============================================================================
# Web Service Deployment（前端）
# ============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-web
  namespace: mcpcan
  labels:
    app: mcp-web
    app.kubernetes.io/name: mcp-web
    app.kubernetes.io/component: web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mcp-web
  template:
    metadata:
      labels:
        app: mcp-web
        app.kubernetes.io/name: mcp-web
    spec:
      containers:
      - name: mcp-web
        image: 77kymo/mcp-web:v2.1.1  # 改为实际 Harbor 地址
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 3000
          name: http
        env:
        - name: TZ
          value: "Asia/Shanghai"
        resources:
          requests:
            memory: "128Mi"
            cpu: "256m"
          limits:
            memory: "256Mi"
            cpu: "512m"
        readinessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 2
          failureThreshold: 3
        volumeMounts:
        - name: env-config
          mountPath: /app/env.js
          subPath: env.js
          readOnly: true
        - name: data-volume
          mountPath: /app/static
          subPath: static
      volumes:
      - name: env-config
        configMap:
          name: mcpcan-config
          items:
          - key: env.js
            path: env.js
      - name: data-volume
        persistentVolumeClaim:
          claimName: mcpcan-data-pvc

---
# Web Service（ClusterIP）
apiVersion: v1
kind: Service
metadata:
  name: mcp-web-svc
  namespace: mcpcan
  labels:
    app: mcp-web
spec:
  type: ClusterIP
  ports:
  - port: 3000
    targetPort: 3000
    protocol: TCP
    name: http
  selector:
    app: mcp-web

---
# ============================================================================
# Entry Service Deployment（Traefik 入口网关）
# ============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-entry
  namespace: mcpcan
  labels:
    app: mcp-entry
    app.kubernetes.io/name: mcp-entry
    app.kubernetes.io/component: entry
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mcp-entry
  template:
    metadata:
      labels:
        app: mcp-entry
        app.kubernetes.io/name: mcp-entry
    spec:
      containers:
      - name: mcp-entry
        image: traefik:v3.6.9
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 80
          name: web
        - containerPort: 443
          name: websecure
        - containerPort: 8080
          name: dashboard
        resources:
          requests:
            memory: "64Mi"
            cpu: "128m"
          limits:
            memory: "256Mi"
            cpu: "512m"
        volumeMounts:
        - name: traefik-config
          mountPath: /etc/traefik/traefik.yaml
          subPath: traefik.yaml
          readOnly: true
        - name: dynamic-config
          mountPath: /etc/traefik/dynamic.yaml
          subPath: dynamic.yaml
          readOnly: true
      volumes:
      - name: traefik-config
        configMap:
          name: mcpcan-config
          items:
          - key: traefik.yaml
            path: traefik.yaml
      - name: dynamic-config
        configMap:
          name: mcpcan-config
          items:
          - key: dynamic.yaml
            path: dynamic.yaml

---
# Entry Service（LoadBalancer 或 NodePort）
apiVersion: v1
kind: Service
metadata:
  name: mcp-entry-svc
  namespace: mcpcan
  labels:
    app: mcp-entry
spec:
  type: LoadBalancer  # 改为 NodePort（如无 LoadBalancer）
  ports:
  - port: 80
    targetPort: 80
    protocol: TCP
    name: http
  - port: 443
    targetPort: 443
    protocol: TCP
    name: websecure
  - port: 8080
    targetPort: 8080
    protocol: TCP
    name: dashboard
  selector:
    app: mcp-entry
